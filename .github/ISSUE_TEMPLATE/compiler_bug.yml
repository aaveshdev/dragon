name: Compiler Bug
description: Report a bug in the Dragon compiler
title: "[COMPILER BUG]: "
labels: ["bug", "compiler"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a compiler bug!
  - type: input
    id: version
    attributes:
      label: Version
      description: What version of Dragon are you using?
      placeholder: "e.g., v0.1.3"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Please provide a clear and concise description of the compiler bug.
      placeholder: What does the compiler do incorrectly?
    validations:
      required: true
  - type: textarea
    id: code
    attributes:
      label: Minimal Code Example
      description: Please provide a minimal Dragon code example that triggers the bug.
      placeholder: |
        ```dragon
        // Your code here
        ```
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: Please describe what you expected to happen.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: Please describe what actually happened (including any error messages).
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      description: What operating system are you using?
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: textarea
    id: additional
    attributes:
      label: Additional Information
      description: Add any other context about the problem here (e.g., output of `dragon --version`, logs).