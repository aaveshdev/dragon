name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. v1.2.0) -- tags the release and names every artifact"
        required: true
        type: string

permissions:
  contents: write

env:
  BIN_NAME: dragon

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            use_cross: false
          - name: linux-aarch64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            use_cross: true
          - name: windows-x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            use_cross: false
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
            use_cross: false
          - name: macos-x86_64
            os: macos-latest
            target: x86_64-apple-darwin
            use_cross: false
          - name: macos-arm64
            os: macos-latest
            target: aarch64-apple-darwin
            use_cross: false

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: Cache cargo/target
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build (cross)
        if: matrix.use_cross
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (cargo)
        if: ${{ !matrix.use_cross }}
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          stage="dragon-${{ inputs.version }}-${{ matrix.name }}"
          mkdir -p "$stage"
          cp "target/${{ matrix.target }}/release/${BIN_NAME}" "$stage/"
          [ -f README.md ] && cp README.md "$stage/"
          [ -f ANDROID_DEVELOPMENT.md ] && cp ANDROID_DEVELOPMENT.md "$stage/"
          [ -f LICENSE ] && cp LICENSE "$stage/"
          tar -czf "${stage}.tar.gz" "$stage"
          echo "ASSET=${stage}.tar.gz" >> "$GITHUB_ENV"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "dragon-${{ inputs.version }}-${{ matrix.name }}"
          New-Item -ItemType Directory -Path $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/$env:BIN_NAME.exe" -Destination $stage
          foreach ($f in @("README.md", "ANDROID_DEVELOPMENT.md", "LICENSE")) {
            if (Test-Path $f) { Copy-Item $f -Destination $stage }
          }
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          echo "ASSET=$stage.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  source:
    name: Source archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build source archive
        run: |
          set -euo pipefail
          name="dragon-${{ inputs.version }}-src"
          git archive --format=tar.gz --prefix="${name}/" -o "${name}.tar.gz" HEAD
          echo "ASSET=${name}.tar.gz" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: source
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: [build, source]
    runs-on: ubuntu-latest
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Dragon ${{ inputs.version }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
