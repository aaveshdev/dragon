name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Linux glibc — native runners ────────────────────────────────
          - { target: x86_64-unknown-linux-gnu,    runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-gnu,   runner: ubuntu-24.04-arm }

          # ── Linux musl — via `cross` (kernel headers + C toolchain set up) ──
          - { target: x86_64-unknown-linux-musl,   runner: ubuntu-24.04, use_cross: true }
          - { target: aarch64-unknown-linux-musl,  runner: ubuntu-24.04, use_cross: true }

          # ── Windows ─────────────────────────────────────────────────────
          - { target: x86_64-pc-windows-msvc,      runner: windows-latest }
          - { target: aarch64-pc-windows-msvc,     runner: windows-11-arm }

          # ── macOS ───────────────────────────────────────────────────────
          - { target: x86_64-apple-darwin,         runner: macos-15-intel }
          - { target: aarch64-apple-darwin,        runner: macos-14 }

          
          # ── Termux (Android — Bionic libc, via cross + NDK) ────────────
          - { target: aarch64-linux-android,       runner: ubuntu-24.04, use_cross: true }
          - { target: armv7-linux-androideabi,     runner: ubuntu-24.04, use_cross: true }

          # ── iSH (iOS Alpine — x86 musl, via cross) ─────────────────────
          - { target: i686-unknown-linux-musl,     runner: ubuntu-24.04, use_cross: true }

          # ── WebAssembly (cdylib only) ───────────────────────────────────
          # - { target: wasm32-unknown-unknown,      runner: ubuntu-24.04, lib_only: true }

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@v2
        with:
          tool: cross

      - name: APT deps (Linux only)
        if: matrix.apt
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      - name: Read bin/lib names from Cargo.toml
        id: meta
        shell: bash
        run: |
          PKG=$(awk -F'"' '/^\[/{s=$0} s=="[package]" && /^[[:space:]]*name[[:space:]]*=/{print $2; exit}' Cargo.toml)
          BIN=$(awk -F'"' '/^\[/{s=$0} s=="[[bin]]"    && /^[[:space:]]*name[[:space:]]*=/{print $2; exit}' Cargo.toml)
          LIB=$(awk -F'"' '/^\[/{s=$0} s=="[lib]"      && /^[[:space:]]*name[[:space:]]*=/{print $2; exit}' Cargo.toml)
          # Cargo defaults: bin falls back to package name; lib falls back to package name with - → _
          BIN=${BIN:-$PKG}
          LIB=${LIB:-${PKG//-/_}}
          echo "name=$BIN" >> "$GITHUB_OUTPUT"
          echo "lib=$LIB"  >> "$GITHUB_OUTPUT"
          echo "Bin: $BIN   Lib: $LIB"

      - name: Build
        shell: bash
        run: |
          TOOL=cargo
          [ "${{ matrix.use_cross }}" = "true" ] && TOOL=cross
          if [ "${{ matrix.lib_only }}" = "true" ]; then
            $TOOL build --release --target ${{ matrix.target }} --lib
          else
            $TOOL build --release --target ${{ matrix.target }}
          fi

      - name: Stage artifacts
        id: stage
        shell: bash
        run: |
          set -e
          NAME='${{ steps.meta.outputs.name }}'
          LIB='${{ steps.meta.outputs.lib }}'
          TARGET='${{ matrix.target }}'
          OUT="target/$TARGET/release"
          STAGE="$NAME-$TARGET"
          mkdir -p "$STAGE"

          case "$TARGET" in
            *windows*)
              [ -f "$OUT/$NAME.exe"     ] && cp "$OUT/$NAME.exe"     "$STAGE/" || true
              [ -f "$OUT/$LIB.dll"      ] && cp "$OUT/$LIB.dll"      "$STAGE/" || true
              [ -f "$OUT/$LIB.dll.lib"  ] && cp "$OUT/$LIB.dll.lib"  "$STAGE/" || true
              ;;
            *apple*)
              [ -f "$OUT/$NAME"         ] && cp "$OUT/$NAME"         "$STAGE/" || true
              [ -f "$OUT/lib$LIB.dylib" ] && cp "$OUT/lib$LIB.dylib" "$STAGE/" || true
              ;;
            *wasm*)
              [ -f "$OUT/$LIB.wasm"     ] && cp "$OUT/$LIB.wasm"     "$STAGE/" || true
              ;;
            *)  # linux gnu + musl
              [ -f "$OUT/$NAME"         ] && cp "$OUT/$NAME"         "$STAGE/" || true
              [ -f "$OUT/lib$LIB.so"    ] && cp "$OUT/lib$LIB.so"    "$STAGE/" || true
              ;;
          esac

          echo "Staged files:" && ls -la "$STAGE"
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"

      - name: Archive
        shell: bash
        run: |
          STAGE='${{ steps.stage.outputs.stage }}'
          case '${{ matrix.target }}' in
            *windows*) 7z a "$STAGE.zip" "./$STAGE/*" ;;
            *)         tar -czf "$STAGE.tar.gz" "$STAGE" ;;
          esac

      - name: Upload (downloadable from this workflow run)
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.stage }}
          path: |
            ${{ steps.stage.outputs.stage }}.zip
            ${{ steps.stage.outputs.stage }}.tar.gz
          if-no-files-found: ignore

  release:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - run: ls -la artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.zip
          generate_release_notes: true
          fail_on_unmatched_files: false