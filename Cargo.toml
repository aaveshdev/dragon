[package]
name = "dragon"
version = "1.0.0"
edition = "2021"

[profile.release]
opt-level = "z"     # Optimize for size
lto = true          # Link Time Optimization (removes unused code)
codegen-units = 1   # Slower compile, but smaller binary
panic = "abort"     # Removes heavy stack unwinding code
strip = true        # Automatically strip debug symbols (Crucial!)

# The DLL Template (built as dragon_lib.dll / libdragon_lib.so)
[lib]
name = "dragon_lib"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"] 

# The CLI Tool (built as dragon_lang.exe)
[[bin]]
name = "dragon"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = { version = "1", default-features = false, features = ["std", "perf"] }
ureq = { version = "2.9", default-features = false, features = ["json", "native-tls"] }
tiny_http = "0.12"
libloading = "0.8"
rand = "0.8"
chrono = "0.4"
lazy_static = "1.4" # Needed for global state in the DLL
libc = "0.2"

wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

base64 = "0.21"

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement"
]