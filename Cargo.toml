[package]
name = "dragon"
version = "1.0.0"
edition = "2021"

[profile.release]
opt-level = "z"     # optimise for size
lto = true          # link-time optimisation
codegen-units = 1   # slower build, smaller binary
panic = "abort"     # no unwinding tables
strip = true        # strip debug symbols


# The DLL Template (built as dragon_lib.dll / libdragon_lib.so)
[lib]
name = "dragon_lib"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"] 

#[lib]
#name = "dragon_android"
#crate-type = ["cdylib"]

# The CLI Tool (built as dragon_lang.exe)
[[bin]]
name = "dragon"
path = "src/main.rs"

[features]
default = []
# Old hand-written JNI entry points in lib.rs (kept for reference, not used by `dragon create`).
legacy_android = ["dep:jni"]
# Type-check the Android JNI glue (src/ui_host.rs) on the desktop.
jni-glue = ["dep:jni"]

[build-dependencies]
chrono = "0.4"

[dependencies]
jni = { version = "0.21", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl"] }
bincode = "1.3"
rand = "0.8"
chrono = "0.4"
lazy_static = "1.4" # Needed for global state in the DLL
libc = "0.2"
libffi = "5.2"
zip = "0.6"
aes-gcm = "0.10"
itoa = "1"
tokio = { version = "1.35", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "fs",
    "time",
    "io-util",
] }
async-recursion = "1.0"
futures = "0.3" # Helps with promise state sharing
crossterm = "0.27"
roxmltree = "0.20"
ttf-parser = "0.25"
fontdb = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
flate2 = "1"

#cranelift-codegen  = { version = "0.113", features = ["x86", "arm64"] }
#cranelift-frontend = "0.113"
#cranelift-module   = "0.113"
#cranelift-object   = "0.113"
#cranelift-native   = "0.113"

wasm-bindgen = "0.2"
getrandom = { version = "0.2", features = ["js"] }
console_error_panic_hook = "0.1"

base64 = "0.21"
libloading = "0.8"
sha2 = "0.10"
md-5 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
[target.aarch64-unknown-linux-gnu.dependencies]
openssl = { version = "0.10", features = ["vendored"] }

[target.'cfg(not(any(target_arch = "wasm32", target_os = "android")))'.dependencies]
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
ureq = { version = "2.9", default-features = false, features = ["json", "tls"] }
tiny_http = "0.12"


[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlElement"
]

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
ndk = { version = "0.7" }

#[workspace]
#members = [".", "dragon_runtime"]
